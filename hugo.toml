baseURL = 'https://galette.eu/site/'
title = 'Galette'
defaultContentLanguage = 'en'
[params]
  email = 'contact@galette.eu'
  author = 'Johan Cwiklinski'
  github_username = 'galette'
  mastodon_username = 'galette'
  mastodon_instance = 'framapiaf.org'
  # Global parameters
  galette_last_release = '1.3.4'
  galette_stable_url = 'https://galette.eu/download/galette-1.3.4.tar.bz2'
  galette_nightly_url = 'https://galette.eu/download/galette-dev.tar.bz2'
  galette_doc_url = 'https://doc.galette.eu'
  galette_tracker_url = 'https://bugs.galette.eu/projects/galette/'
  galette_trad_url = 'https://hosted.weblate.org/projects/galette/galette/'
  galette_vote_url = 'https://vote.galette.eu/'
  galette_discussions_url = 'https://github.com/orgs/galette/discussions'
  # Donations; the recurring button shows up once the Open Collective URL is set
  donate_stripe_url = 'https://donate.stripe.com/dR6bJz7mX1Na0GQ5kk'
  # donate_opencollective_url = 'https://opencollective.com/galette'
[pagination]
  pagerSize = 5

[server]
  port = 1313

[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "why"
    pageRef = "/why"
    weight = 14
  [[menus.main]]
    identifier = "features"
    weight = 15
  [[menus.main]]
    identifier = "members"
    parent = "features"
    pageRef = "/members"
    weight = 2
  [[menus.main]]
    identifier = "fees"
    parent = "features"
    pageRef = "/fees"
    weight = 3
  [[menus.main]]
    identifier = "communication"
    parent = "features"
    pageRef = "/communication"
    weight = 4
  [[menus.main]]
    identifier = "plugins"
    parent = "features"
    pageRef = "/plugins"
    weight = 5
  [[menus.main]]
    identifier = "aboutsection"
    weight = 20
  [[menus.main]]
    identifier = "about"
    parent = "aboutsection"
    pageRef = "/about"
    weight = 1
  [[menus.main]]
    identifier = "history"
    parent = "aboutsection"
    pageRef = "/history"
    weight = 2
  [[menus.main]]
    identifier = "roadmap"
    parent = "aboutsection"
    pageRef = "/roadmap"
    weight = 3
  [[menus.main]]
    identifier = "posts"
    pageRef = "/posts"
    weight = 30
  [[menus.main]]
    identifier = "contribute"
    pageRef = "/contribute"
    weight = 40
  [[menus.main]]
    identifier = "contact"
    pageRef = "/contact"
    weight = 50
  [[menus.main]]
    identifier = "tracker"
    url = 'https://bugs.galette.eu/projects/galette/'
    weight = 60
  [[menus.main]]
    identifier = "demo"
    url = "https://demo.galette.eu/"
    weight = 70

[languages]
  [languages.fr]
    languageName = 'Français'
    weight = 1
    contentDir = 'content/fr'
  [languages.en]
    languageName = 'English'
    weight = 2
    contentDir = 'content/en'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[permalinks]
  posts = '/post/:year/:month/:day/:slug/'

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[slugify]
  # Cleanup URLs (lowercase, no accents)
  strategies = ["ascii"]

[outputs]
  home = ['html', 'rss']
  section = ['html']
  taxonomy = []
  term = []

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"

[services]
  [services.rss]
    limit = 10
