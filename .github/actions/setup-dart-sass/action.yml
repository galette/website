name: Setup Dart Sass
description: Install a pinned Dart Sass release from GitHub, cached between runs (Hugo needs it since 0.170 dropped LibSass)

inputs:
  version:
    description: Dart Sass version, see https://github.com/sass/dart-sass/releases
    required: false
    default: '1.108.2'

runs:
  using: composite
  steps:
    - name: Restore Dart Sass from cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/dart-sass
        key: dart-sass-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download Dart Sass
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SASS_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL --retry 3 \
          "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" \
          | tar -xz -C "${RUNNER_TEMP}"

    - name: Add Dart Sass to the PATH
      shell: bash
      run: |
        echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/dart-sass/sass" --version
