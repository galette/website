name: Check dead links
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --gc --minify --baseURL https://galette.eu/site/
      - name: HTML5Validator
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: public/
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Pages of the site itself are checked against the build, not online,
          # so that pages added by a pull request are not reported as missing.
          # On pull requests, a release tarball is not uploaded yet.
          args: >-
            --verbose --no-progress
            --base-url https://galette.eu/
            --remap '^https://galette\.eu/site/ file://${{ github.workspace }}/public/'
            --index-files index.html
            ${{ github.event_name == 'pull_request' && '--exclude "^https://galette\.eu/download/"' || '' }}
            './public/**/*.html'
          fail: true
