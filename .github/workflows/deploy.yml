name: Deploy Galette Website
on:
  push:
    branches:
      - main
  schedule:
    # Daily rebuild, so that future-dated posts go live on their own
    - cron: '15 8 * * *'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      # Hugo 0.170 dropped LibSass and the extended build: Sass needs Dart Sass
      - name: Install Dart Sass
        uses: ./.github/actions/setup-dart-sass
      - name: Build
        run: hugo --gc --minify --baseURL https://galette.eu/site/
      - name: Deploy to Dedicated Server
        uses: Burnett01/rsync-deployments@9.0.4
        with:
          switches: -avzr --delete
          path: public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
